services:
  - type: web
    name: banana-leaf-classifier
    runtime: python
    plan: 1c-2g
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 300 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: BANANA_ENABLE_HISTORY
        value: "false"
